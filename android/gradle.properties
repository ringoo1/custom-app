org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Tolerate slow / flaky networks (e.g. phone hotspots) when fetching deps.
# Defaults are 30s; bump to 5 minutes per connect/read.
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
# Serialize downloads — parallel fetches across a constrained uplink make
# individual transfers more likely to time out.
org.gradle.parallel=false
